<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HTML5 Chess + Stockfish</title>
  <style>
    :root {
      --board-sz: min(84vmin, 620px);
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: calc(14px + 2pt);
      background-color: #1a1a20;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: clamp(6px, 1.5vh, 16px) clamp(8px, 2vw, 20px);
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
    }
    h1 { 
      margin: 2px 0; 
      font-size: clamp(1.15rem, 2.5vmin, 1.6rem); 
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.78rem, 1.4vmin, 0.95rem);
      margin-bottom: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f39c12;
    }
    .dot.connected { background: #2ecc71; }
    .dot.offline { background: #9b59b6; }
    .dot.http { background: #3498db; }
    .dot.error { background: #e74c3c; }

    .game-area {
      display: flex;
      width: 100%;
      max-width: var(--board-sz);
      justify-content: center;
    }
    #board-wrapper {
      position: relative;
      width: var(--board-sz);
      height: var(--board-sz);
      max-width: calc(100vw - 20px);
      max-height: calc(100dvh - 200px);
      aspect-ratio: 1 / 1;
      user-select: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      border-radius: 6px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 12.5%);
      grid-template-rows: repeat(8, 12.5%);
      width: 100%;
      height: 100%;
      border: 2px solid #333;
      border-radius: 4px;
      overflow: hidden;
    }
    .square {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .square span.piece-icon {
      font-size: clamp(28px, calc(var(--board-sz) / 10.5), 58px);
      line-height: 1;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
    }
    .light { background-color: #e2d6b5; }
    .dark { background-color: #b88b4a; }
    .selected { background-color: #7fa650 !important; }

    .valid-dest::after {
      content: "";
      width: 28%;
      height: 28%;
      background: rgba(20, 20, 20, 0.35);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
    }
    .valid-capture::after {
      content: "";
      width: 75%;
      height: 75%;
      border: 4px solid rgba(231, 76, 60, 0.6);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
    }

    #arrow-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #game-over-banner {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(18, 18, 24, 0.88);
      backdrop-filter: blur(3px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      border-radius: 4px;
      animation: popIn 0.25s ease-out;
      text-align: center;
      padding: 16px;
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    #game-over-title {
      font-size: calc(1.6rem + 2pt);
      font-weight: 800;
      margin: 0 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .winner-white { color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
    .winner-black { color: #e74c3c; text-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
    .winner-draw { color: #3498db; text-shadow: 0 0 10px rgba(52, 152, 219, 0.5); }

    #game-over-subtitle {
      font-size: calc(0.95rem + 2pt);
      color: #ddd;
      margin: 0 0 16px 0;
    }

    .play-again-btn {
      background: #2ecc71 !important;
      border: none !important;
      color: #111 !important;
      font-weight: 700 !important;
      font-size: calc(0.95rem + 2pt) !important;
      padding: 10px 20px !important;
      border-radius: 20px !important;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(46, 204, 113, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .play-again-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(46, 204, 113, 0.6);
    }

    .analysis-panel {
      width: 100%;
      max-width: var(--board-sz);
      background: #25252e;
      border-radius: 8px;
      padding: clamp(8px, 1.2vh, 12px) clamp(10px, 1.5vw, 16px);
      margin-top: 8px;
      font-size: clamp(0.85rem, 1.5vmin, 1.05rem);
      border: 1px solid #383844;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .opening-badge {
      font-size: clamp(0.72rem, 1.3vmin, 0.88rem);
      color: #e5c07b;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      border-bottom: 1px solid #383844;
      padding-bottom: 3px;
    }
    .best-move {
      color: #2ecc71;
      font-weight: bold;
      font-size: clamp(0.88rem, 1.6vmin, 1.15rem);
    }
    .pv-line {
      font-family: monospace;
      color: #88c0d0;
      font-size: clamp(0.75rem, 1.3vmin, 0.92rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: var(--board-sz);
      box-sizing: border-box;
    }
    button, select {
      background: #33333f;
      color: white;
      border: 1px solid #555;
      padding: 7px 11px;
      font-size: clamp(0.78rem, 1.3vmin, 0.95rem);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }
    button.active {
      background: #007acc;
      border-color: #38a5e8;
    }
    .sound-btn {
      font-weight: 600;
    }
    .sound-btn.active {
      background: #27ae60 !important;
      border-color: #2ecc71 !important;
      color: #ffffff !important;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.45);
    }
    .sound-btn.muted {
      background: #33333f !important;
      border-color: #64748b !important;
      color: #94a3b8 !important;
      box-shadow: none;
    }
    button.error-retry {
      background: #c0392b !important;
      border-color: #e74c3c !important;
    }
    #debug-log {
      width: 100%;
      max-width: var(--board-sz);
      background: #111;
      color: #0f0;
      font-family: monospace;
      font-size: clamp(0.72rem, 1.2vmin, 0.88rem);
      padding: 6px 10px;
      margin-top: 8px;
      border-radius: 6px;
      max-height: 65px;
      overflow-y: auto;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h1>HTML5 Chess + Stockfish</h1>
  
  <div class="status-bar">
    <div id="status-dot" class="dot"></div>
    <span id="status-label">Initializing...</span>
  </div>

  <div class="game-area">
    <div id="board-wrapper">
      <div id="board"></div>

      <svg id="arrow-overlay">
        <defs id="marker-defs"></defs>
      </svg>

      <div id="game-over-banner">
        <div id="game-over-title">CHECKMATE!</div>
        <div id="game-over-subtitle">White wins by checkmate</div>
        <button class="play-again-btn" id="bannerNewGameBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div class="analysis-panel">
    <div class="opening-badge" id="opening-display">Opening: Starting Position</div>
    <div class="row">
      <span id="turn-status">White to move</span>
      <span id="depth-label">Depth: -</span>
    </div>
    <div class="row">
      <span class="best-move" id="best-move-display">Analysed Move: -</span>
    </div>
    <div class="pv-line" id="pv-text">Line: -</div>
  </div>

  <div class="controls">
    <button id="newBtn">New</button>
    <button id="flipBtn">Flip</button>
    <button id="modeBtn">Mode: vs AI</button>
    <button id="arrowToggleBtn" class="active">Arrow: ON</button>
    <button id="soundToggleBtn" class="sound-btn active" onclick="toggleChessSound()">🔊 Sound ON</button>
    <button id="retryBtn" style="display:none;" class="error-retry">Retry Engine</button>
    <select id="depthSelect">
      <option value="6">Depth 6 (Fast)</option>
      <option value="10" selected>Depth 10 (Solid)</option>
      <option value="14">Depth 14 (Deep)</option>
    </select>
  </div>

  <div id="debug-log">Ready.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <!-- Complete Clean Engine Pipeline with Local Minimax Offline Fallback -->
  <script src="js/chess.js"></script>
</body>
</html>
