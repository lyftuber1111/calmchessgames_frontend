<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#01050a">
  <meta name="description" content="Multi-stage Sci-Fi WebXR experience - Stage 1: Distant Neon Cyan Wormhole built with Three.js and custom GLSL bloom shaders.">
  <title>Wormhole XR - Stage 1: Distant Neon Cyan Singularity</title>

  <!-- Favicon and App Icons -->
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">

  <!-- Embedded Styling (HTML + CSS in same file as requested) -->
  <style>
    /* ==========================================================================
       SCIFI XR WORMHOLE HUD & COCKPIT THEME
       Color Palette: Deep Space Void (#01050a), Neon Cyan (#00f0ff), Plasma Blue (#0077aa)
       ========================================================================== */
    :root {
      --bg-space: #01050a;
      --cyan-neon: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.45);
      --cyan-dark: #004d66;
      --panel-bg: rgba(2, 16, 28, 0.72);
      --panel-border: rgba(0, 240, 255, 0.35);
      --text-main: #e0f9ff;
      --text-dim: #7dc4d9;
      --accent-alert: #ff477e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-space);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
    }

    /* WebGL 3D Canvas Canvas Container */
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: radial-gradient(circle at center, #021220 0%, #01050a 100%);
    }

    /* Sci-Fi Hologram Overlay HUD */
    #hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(10px, 2.5vmin, 24px);
    }

    /* Holographic Corner Reticles */
    .hud-reticle {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid var(--cyan-neon);
      opacity: 0.6;
    }
    .reticle-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .reticle-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
    .reticle-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
    .reticle-br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

    /* Top Telemetry Header */
    .hud-header {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pulsing-orb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--cyan-neon);
      box-shadow: 0 0 12px var(--cyan-neon), 0 0 24px var(--cyan-neon);
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.9); opacity: 0.75; }
      50% { transform: scale(1.25); opacity: 1.0; }
    }

    .game-title {
      font-size: clamp(0.95rem, 2vmin, 1.35rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 10px var(--cyan-neon);
    }

    .game-subtitle {
      font-size: clamp(0.7rem, 1.2vmin, 0.82rem);
      letter-spacing: 1.5px;
      color: var(--cyan-neon);
      text-transform: uppercase;
    }

    .telemetry-badges {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .badge-val {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--cyan-neon);
    }

    /* Interactive Bottom Navigation & Controls */
    .hud-footer {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 -4px 20px rgba(0, 240, 255, 0.12);
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .control-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hud-btn {
      background: rgba(0, 40, 60, 0.85);
      border: 1px solid var(--cyan-neon);
      color: var(--cyan-neon);
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .hud-btn:hover {
      background: var(--cyan-neon);
      color: #010b14;
      box-shadow: 0 0 18px var(--cyan-neon);
    }

    .hud-btn.active {
      background: #00f0ff;
      color: #010b14;
      box-shadow: 0 0 22px #00f0ff;
      border-color: #fff;
    }

    .hud-slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .hud-slider-group input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 5px;
      background: var(--cyan-dark);
      border-radius: 3px;
      outline: none;
    }

    .hud-slider-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan-neon);
      cursor: pointer;
      box-shadow: 0 0 8px var(--cyan-neon);
    }

    /* WebXR Native Button Styling Override */
    #xr-enter-btn {
      position: fixed !important;
      bottom: 24px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 100 !important;
      background: rgba(0, 240, 255, 0.9) !important;
      color: #010b14 !important;
      border: 1px solid #ffffff !important;
      font-weight: 700 !important;
      letter-spacing: 1.5px !important;
      padding: 12px 24px !important;
      border-radius: 30px !important;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8) !important;
      cursor: pointer !important;
      font-family: inherit !important;
      text-transform: uppercase !important;
    }

    #xr-enter-btn:hover {
      background: #ffffff !important;
      color: #000000 !important;
      box-shadow: 0 0 35px #00f0ff !important;
    }

    /* Crosshair Center Reticle */
    .center-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      pointer-events: none;
      opacity: 0.4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center-crosshair::before,
    .center-crosshair::after {
      content: '';
      position: absolute;
      background: var(--cyan-neon);
    }
    .center-crosshair::before { width: 100%; height: 1px; }
    .center-crosshair::after { height: 100%; width: 1px; }

    /* Hide HUD in XR presentation mode */
    body.in-xr-session #hud-layer {
      display: none !important;
    }

    /* Responsive adjustments */
    @media (max-width: 680px) {
      .hud-header, .hud-footer {
        padding: 8px 12px;
      }
      .badge:not(:first-child) {
        display: none;
      }
      .hud-slider-group {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- WebGL 3D Canvas Mount Point -->
  <div id="webgl-container"></div>

  <!-- Holographic Sci-Fi Telemetry HUD -->
  <div id="hud-layer">
    <!-- Corner Boundary Reticles -->
    <div class="hud-reticle reticle-tl"></div>
    <div class="hud-reticle reticle-tr"></div>
    <div class="hud-reticle reticle-bl"></div>
    <div class="hud-reticle reticle-br"></div>

    <!-- Center Aim Reticle -->
    <div class="center-crosshair"></div>

    <!-- Top Telemetry Bar -->
    <header class="hud-header">
      <div class="title-group">
        <div class="pulsing-orb"></div>
        <div>
          <div class="game-title">WORMHOLE XR</div>
          <div id="hud-status" class="game-subtitle">STAGE 1: DISTANT ANOMALY MONITOR</div>
        </div>
      </div>

      <div class="telemetry-badges">
        <div class="badge">
          <span>SINGULARITY RANGE</span>
          <span id="hud-distance" class="badge-val">92,400 KM</span>
        </div>
        <div class="badge">
          <span>TACHYON FLUX</span>
          <span id="hud-flux" class="badge-val">14.8 TeV</span>
        </div>
        <div class="badge">
          <span>FRAME REFRESH</span>
          <span id="hud-fps" class="badge-val">60 FPS</span>
        </div>
      </div>
    </header>

    <!-- Bottom Tactical Control Panel -->
    <footer id="hud-panel" class="hud-footer">
      <div class="control-cluster">
        <button id="btn-warp" class="hud-btn" title="Initiate sub-light cruise towards the event horizon">
          🚀 Engage Warp
        </button>
        <button id="btn-toggle-audio" class="hud-btn" title="Toggle procedural cosmic synthesizer">
          <span class="icon">🔇</span> Synth Audio: OFF
        </button>
      </div>

      <div class="control-cluster">
        <div class="hud-slider-group">
          <label for="slider-bloom">NEON BLOOM</label>
          <input id="slider-bloom" type="range" min="0.0" max="3.5" step="0.1" value="1.85">
          <span id="val-bloom" class="badge-val">1.85</span>
        </div>
        <button id="btn-toggle-hud" class="hud-btn" title="Toggle interface overlay visibility">
          👁 HUD
        </button>
      </div>
    </footer>
  </div>

  <!-- Primary Game Module -->
  <script type="module" src="js/wormhole0.js"></script>

</body>
</html>
