<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Ergonomics & Back Mobility Trainer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --highlight: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      max-width: 800px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    /* Tab navigation bar */
    .tab-bar {
      display: flex;
      overflow-x: auto;
      background: #0b1324;
      border-bottom: 1px solid var(--card-border);
      padding: 0.25rem 0.5rem;
      scrollbar-width: thin;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border-radius: 0.5rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      background: rgba(0, 0, 0, 0.25);
    }

    /* Tab Content Area */
    .content-area {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .content-area {
        grid-template-columns: 1fr;
      }
    }

    /* Visualizer Frame */
    .visualizer-card {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      min-height: 280px;
      position: relative;
    }

    .svg-visualizer {
      width: 100%;
      height: 220px;
    }

    .visualizer-caption {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.5rem;
    }

    /* Instructions & Timer */
    .exercise-details {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .info-header {
      margin-bottom: 1rem;
    }

    .category-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      display: inline-block;
    }

    .exercise-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .exercise-meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .meta-pill {
      background: #0f172a;
      padding: 0.2rem 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid var(--card-border);
    }

    .steps-list {
      list-style-type: decimal;
      padding-left: 1.25rem;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }

    .steps-list li {
      margin-bottom: 0.4rem;
    }

    /* Timer Widget */
    .timer-panel {
      background: #0b1324;
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .timer-display {
      font-size: 2.2rem;
      font-family: monospace;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .timer-controls {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 0.6rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b1324;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    /* Keyframe Animations for SVGs */
    @keyframes pulse-ring {
      0% { r: 12; opacity: 0.8; }
      50% { r: 18; opacity: 0.2; }
      100% { r: 12; opacity: 0.8; }
    }

    @keyframes mckenzie-arch {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
    }

    @keyframes cat-cow-spine {
      0%, 100% { d: path("M 80,120 Q 140,110 200,120"); }
      50% { d: path("M 80,120 Q 140,150 200,120"); }
    }

    @keyframes arm-leg-reach {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .anim-pulse {
      animation: pulse-ring 2s infinite ease-in-out;
    }
    .anim-arch {
      transform-origin: 140px 160px;
      animation: mckenzie-arch 4s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <header>
    <h1>Desk Ergonomics & Back Mobility Trainer</h1>
    <p>Select any drill below. Use the animated visualizer and interactive timer to pace each routine.</p>
  </header>

  <main class="container">
    <!-- Tab Strip -->
    <nav class="tab-bar" id="tabBar"></nav>

    <!-- Dynamic Exercise Frame -->
    <section class="content-area">
      <!-- Animated Visualizer Card -->
      <div class="visualizer-card">
        <div id="svgContainer" class="svg-visualizer"></div>
        <div id="visualizerCaption" class="visualizer-caption"></div>
      </div>

      <!-- Detail & Timer Column -->
      <div class="exercise-details">
        <div class="info-header">
          <span id="categoryTag" class="category-tag"></span>
          <h2 id="exerciseTitle" class="exercise-title"></h2>
          <div class="exercise-meta">
            <span id="targetMuscle" class="meta-pill"></span>
            <span id="suggestedTime" class="meta-pill"></span>
          </div>
          <ol id="stepList" class="steps-list"></ol>
        </div>

        <!-- Timer Panel -->
        <div class="timer-panel">
          <div id="timerDisplay" class="timer-display">00:30</div>
          <div class="timer-controls">
            <button id="startBtn" class="btn btn-primary" onclick="toggleTimer()">Start Timer</button>
            <button id="resetBtn" class="btn btn-secondary" onclick="resetTimer()">Reset</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Database of exercises covered in the conversation
    const exercises = [
      {
        id: "seated-fig4",
        name: "Seated Figure-4",
        category: "Desk Stretch",
        target: "Glutes & Piriformis",
        duration: 30,
        caption: "Cross ankle over knee and hinge slightly from hips",
        steps: [
          "Sit upright at the edge of your office chair with spine tall.",
          "Cross your right ankle over your left knee, creating a '4' shape.",
          "Hinge gently forward at your hips while keeping your back completely flat.",
          "Hold for 30 seconds to open hip rotator, then switch legs."
        ],
        renderSVG: () => `
          <svg viewBox="0 0 280 200" width="100%" height="100%">
            <!-- Chair -->
            <path d="M 60,80 L 60,150 L 140,150 L 140,80" fill="none" stroke="#475569" stroke-width="4"/>
            <line x1="100" y1="150" x2="100" y2="185" stroke="#475569" stroke-width="4"/>
            <line x1="75" y1="185" x2="125" y2="185" stroke="#475569" stroke-width="3"/>
            <!-- Torso (Hinging forward) -->
            <line x1="85" y1="140" x2="115" y2="70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
            <!-- Head -->
            <circle cx="125" cy="55" r="14" fill="#38bdf8"/>
            <!-- Folded Leg (Figure 4) -->
            <line x1="85" y1="140" x2="130" y2="140" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
            <line x1="130" y1="140" x2="100" y2="120" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
            <line x1="100" y1="120" x2="85" y2="140" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
            <!-- Ground Leg -->
            <line x1="130" y1="140" x2="130" y2="185" stroke="#94a3b8" stroke-width="4"/>
            <!-- Pulse Glow on Glute -->
            <circle cx="85" cy="140" r="12" fill="#f59e0b" opacity="0.3" class="anim-pulse"/>
            <!-- Arrow indicating hip hinge -->
            <path d="M 120,40 Q 140,45 145,60" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
          </svg>`
      },
      {
        id: "seated-twist",
        name: "Seated Spinal Twist",
        category: "Desk Stretch",
        target: "Thoracic Mobility",
        duration: 20,
        caption: "Rotate from upper ribcage, keeping hips square",
        steps: [
          "Sit tall with both feet flat on the floor.",
          "Place your right hand on the outside of your left thigh or armrest.",
          "Gently rotate your ribcage and shoulders toward the left.",
          "Breathe deeply into the rotation for 20 seconds; repeat on other side."
        ],
        renderSVG: () => `
          <svg viewBox="0 0 280 200" width="100%" height="100%">
            <!-- Chair base -->
            <rect x="90" y="140" width="90" height="10" rx="3" fill="#475569"/>
            <line x1="135" y1="150" x2="135" y2="185" stroke="#475569" stroke-width="4"/>
            <!-- Spine axis -->
            <line x1="135" y1="70" x2="135" y2="140" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
            <circle cx="135" cy="50" r="14" fill="#38bdf8"/>
            <!-- Shoulders rotating -->
            <line x1="105" y1="85" x2="165" y2="75" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
            <!-- Directional Curvature Arrows -->
            <path d="M 100,65 A 35 35 0 0 1 170,65" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="4,4"/>
            <polyline points="168,60 172,66 166,70" fill="none" stroke="#10b981" stroke-width="3"/>
          </svg>`
      },
      {
        id: "mckenzie",
        name: "Standing McKenzie Extension",
        category: "Hourly 30s Reset",
        target: "Lumbar Disc Decompression",
        duration: 30,
        caption: "Hands on lower back, squeeze glutes, arch gently backward",
        steps: [
          "Stand up with feet hip-width apart.",
          "Place your hands on your lower back/sacrum with fingers pointing down.",
          "Firmly squeeze glutes to lock your pelvis in neutral alignment.",
          "Gently arch backward over your hands, holding 2–3s. Repeat for 5 reps."
        ],
        renderSVG: () => `
          <svg viewBox="0 0 280 200" width="100%" height="100%">
            <!-- Ground -->
            <line x1="40" y1="185" x2="240" y2="185" stroke="#334155" stroke-width="2"/>
            <!-- Lower body -->
            <line x1="140" y1="120" x2="140" y2="185" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
            <!-- Hands on sacrum marker -->
            <circle cx="133" cy="115" r="7" fill="#f59e0b"/>
            <!-- Animated Arching Torso -->
            <g class="anim-arch">
              <line x1="140" y1="120" x2="140" y2="60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
              <circle cx="140" cy="45" r="14" fill="#38bdf8"/>
              <!-- Chest line -->
              <line x1="140" y1="75" x2="160" y2="85" stroke="#38bdf8" stroke-width="4"/>
            </g>
            <!-- Fulcrum point -->
            <polygon points="125,125 120,115 130,115" fill="#10b981"/>
          </svg>`
      },
      {
        id: "childs-pose",
        name: "Extended Child's Pose",
        category: "Floor Mobility",
        target: "QL & Thoracolumbar Fascia",
        duration: 60,
        caption: "Knees wide, sink hips to heels, crawl fingertips forward",
        steps: [
          "Kneel on the floor with knees wide and big toes touching.",
          "Sink your hips back onto your heels and reach hands far forward.",
          "Lower your forehead to the mat to lengthen your spine.",
          "Walk hands 1–2 feet right for 15s to stretch left QL, then switch sides."
        ],
        renderSVG: () => `
          <svg viewBox="0 0 280 200" width="100%" height="100%">
            <!-- Mat -->
            <line x1="30" y1="160" x2="250" y2="160" stroke="#334155" stroke-width="4"/>
            <!-- Lower legs & folded hips -->
            <polyline points="70,158 50,158 60,135 110,135" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
            <!-- Elongated Spine -->
            <path d="M 60,135 Q 110,120 180,140" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
            <!-- Head down -->
            <circle cx="190" cy="148" r="12" fill="#38bdf8"/>
            <!-- Reaching Arms -->
            <line x1="180" y1="140" x2="240" y2="158" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
            <!-- Decompression arrows -->
            <line x1="60" y1="110" x2="40" y2="110" stroke="#10b981" stroke-width="2"/>
            <line x1="210" y1="110" x2="230" y2="110" stroke="#10b981" stroke-width="2"/>
          </svg>`
      },
      {
        id: "cat-cow",
        name: "Quadruped Cat-Cow",
        category: "Floor Mobility",
        target: "Whole Spine Articulation",
        duration: 30,
        caption: "Alternate smoothly between spinal flexion and extension",
        steps: [
          "Start on all fours with wrists under shoulders, knees under hips.",
          "Inhale: drop belly, lift chest and tailbone (Cow Pose).",
          "Exhale: press floor away, tuck chin, arch mid-back to ceiling (Cat Pose).",
          "Flow continuously with deep, rhythmic breaths for 30–60 seconds."
        ],
        renderSVG: () => `
          <svg viewBox="0 0 280 200" width="100%" height="100%">
            <!-- Floor line -->
            <line x1="40" y1="170" x2="240" y2="170" stroke="#334155" stroke-width="2"/>
            <!-- Arms and Thighs -->
            <line x1="90" y1="120" x2="90" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <line x1="190" y1="120" x2="190" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <!-- Head -->
            <circle cx="70" cy="110" r="12" fill="#38bdf8"/>
            <!-- Dynamic Spine -->
            <path d="M 85,120 Q 140,80 195,120" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
            <path d="M 85,120 Q 140,145 195,120" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
            <!-- Motion wave -->
            <path d="M 140,65 L 140,55 M 135,60 L 140,55 L 145,60" stroke="#10b981" stroke-width="2" fill="none"/>
          </svg>`
      },
      {
        id: "deadbug",
        name: "The Dead Bug",
        category: "Core Priming",
        target: "Transverse Abdominis & Pelvis",
        duration: 60,
        caption: "Press lower back completely flat against the mat throughout",
        steps: [
          "Lie on back with knees at 90° and arms pointing straight up.",
          "Firmly lock your lower back into the floor (zero gap under spine).",
          "Slowly lower right arm behind head and extend left leg forward.",
          "Exhale strongly, return to center, and alternate sides for 60s."
        ],
        renderSVG: () => `
          <svg viewBox="0 0 280 200" width="100%" height="100%">
            <!-- Mat -->
            <line x1="30" y1="140" x2="250" y2="140" stroke="#334155" stroke-width="3"/>
            <!-- Back glued to floor -->
            <line x1="90" y1="135" x2="170" y2="135" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
            <circle cx="75" cy="133" r="11" fill="#38bdf8"/>
            <!-- Left arm reaching back -->
            <line x1="100" y1="135" x2="60" y2="120" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
            <!-- Right leg extending forward -->
            <line x1="165" y1="135" x2="230" y2="125" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
            <!-- Opposite arm & leg 90 deg -->
            <line x1="100" y1="135" x2="100" y2="80" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
            <polyline points="165,135 165,95 200,95" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
          </svg>`
      },
      {
        id: "birddog",
        name: "The Bird-Dog",
        category: "Core Priming",
        target: "Glutes & Posterior Chain",
        duration: 60,
        caption: "Maintain neutral spine; squeeze glute without hyperextending",
        steps: [
          "Begin on all fours with neutral spine (neck straight, looking down).",
          "Extend right arm forward and kick left leg straight back.",
          "Squeeze the left glute at top; don't raise leg higher than hip level.",
          "Hold for 2 seconds at full extension, return, and alternate sides."
        ],
        renderSVG: () => `
          <svg viewBox="0 0 280 200" width="100%" height="100%">
            <!-- Ground -->
            <line x1="30" y1="170" x2="250" y2="170" stroke="#334155" stroke-width="2"/>
            <!-- Supporting limbs -->
            <line x1="120" y1="110" x2="120" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <line x1="170" y1="110" x2="170" y2="170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <!-- Head & Torso -->
            <circle cx="105" cy="98" r="11" fill="#38bdf8"/>
            <line x1="115" y1="110" x2="175" y2="110" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
            <!-- Extended Arm & Leg (Aligned) -->
            <g class="anim-reach">
              <line x1="115" y1="110" x2="50" y2="110" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
              <line x1="175" y1="110" x2="245" y2="110" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
            </g>
            <!-- Glute activation highlight -->
            <circle cx="180" cy="110" r="10" fill="#f59e0b" opacity="0.4" class="anim-pulse"/>
          </svg>`
      },
      {
        id: "lunge-opener",
        name: "Low Lunge Hip Opener",
        category: "Floor Mobility",
        target: "Psoas & Hip Flexors",
        duration: 30,
        caption: "Tuck pelvis under, squeeze back glute, reach arm overhead",
        steps: [
          "Step right foot forward into a lunge with left knee on floor.",
          "Tuck tailbone forward (posterior pelvic tilt) and contract left glute.",
          "Raise left arm overhead and lean gently to the right.",
          "Hold 30 seconds for deep hip-flexor release, then switch sides."
        ],
        renderSVG: () => `
          <svg viewBox="0 0 280 200" width="100%" height="100%">
            <!-- Floor -->
            <line x1="40" y1="175" x2="240" y2="175" stroke="#334155" stroke-width="2"/>
            <!-- Back Leg (Kneeling) -->
            <line x1="110" y1="115" x2="80" y2="175" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <!-- Front Leg (Foot flat) -->
            <polyline points="110,115 160,115 160,175" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
            <!-- Torso -->
            <line x1="110" y1="115" x2="115" y2="60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
            <circle cx="115" cy="45" r="12" fill="#38bdf8"/>
            <!-- Arm reaching overhead & leaning -->
            <path d="M 115,70 Q 115,25 135,20" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
            <!-- Hip Flexor Stretch Glow -->
            <circle cx="95" cy="135" r="10" fill="#10b981" opacity="0.5" class="anim-pulse"/>
          </svg>`
      }
    ];

    // State
    let currentIndex = 0;
    let timerDuration = exercises[0].duration;
    let timeLeft = timerDuration;
    let timerInterval = null;
    let isRunning = false;

    // Audio tone generator (no audio files required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = "sine";
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 tone
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    // Initialize tabs
    const tabBar = document.getElementById("tabBar");
    exercises.forEach((ex, idx) => {
      const btn = document.createElement("button");
      btn.className = `tab-btn ${idx === 0 ? "active" : ""}`;
      btn.innerHTML = `${ex.name} <span class="badge">${ex.duration}s</span>`;
      btn.onclick = () => selectTab(idx);
      tabBar.appendChild(btn);
    });

    function selectTab(index) {
      clearInterval(timerInterval);
      isRunning = false;

      currentIndex = index;
      const ex = exercises[index];

      // Update active tab button style
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
      });

      // Populate details
      document.getElementById("categoryTag").textContent = ex.category;
      document.getElementById("exerciseTitle").textContent = ex.name;
      document.getElementById("targetMuscle").textContent = `Target: ${ex.target}`;
      document.getElementById("suggestedTime").textContent = `Goal: ${ex.duration}s`;
      document.getElementById("visualizerCaption").textContent = ex.caption;

      // Populate steps
      const stepList = document.getElementById("stepList");
      stepList.innerHTML = "";
      ex.steps.forEach(step => {
        const li = document.createElement("li");
        li.textContent = step;
        stepList.appendChild(li);
      });

      // Load graphic
      document.getElementById("svgContainer").innerHTML = ex.renderSVG();

      // Reset timer
      timerDuration = ex.duration;
      timeLeft = timerDuration;
      updateTimerDisplay();
      document.getElementById("startBtn").textContent = "Start Timer";
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      document.getElementById("timerDisplay").textContent = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        document.getElementById("startBtn").textContent = "Resume";
      } else {
        if (timeLeft <= 0) timeLeft = timerDuration;
        isRunning = true;
        document.getElementById("startBtn").textContent = "Pause";

        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimerDisplay();

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById("startBtn").textContent = "Complete!";
            playBeep();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeLeft = timerDuration;
      updateTimerDisplay();
      document.getElementById("startBtn").textContent = "Start Timer";
    }

    // Initial render
    selectTab(0);
  </script>
</body>
</html>
