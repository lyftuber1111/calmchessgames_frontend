<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meshy 3D - WebXR Model Viewer</title>
  <style>
    :root {
      --bg: #0b0d13;
      --panel-bg: rgba(18, 22, 32, 0.88);
      --accent: #ff2a3b;
      --accent-glow: rgba(255, 42, 59, 0.35);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI Header Overlay */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1rem 1.5rem;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(11, 13, 19, 0.92) 0%, rgba(11, 13, 19, 0) 100%);
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .pill {
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .xr-status-tag {
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      pointer-events: auto;
    }

    .xr-status-tag.active {
      border-color: #10b981;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Left Stats Overlay */
    .info-card {
      position: absolute;
      top: 5rem;
      left: 1.5rem;
      z-index: 10;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 12px;
      backdrop-filter: blur(14px);
      width: 240px;
      font-size: 0.8rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .info-card h4 {
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-lbl {
      color: var(--text-muted);
    }

    .stat-val {
      font-weight: 600;
      color: #e2e8f0;
    }

    /* Right Model Loader Card */
    .model-loader-card {
      position: absolute;
      top: 5rem;
      right: 1.5rem;
      z-index: 10;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 1rem 1.15rem;
      border-radius: 12px;
      backdrop-filter: blur(14px);
      width: 340px;
      max-width: calc(100vw - 3rem);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h4 {
      font-size: 0.85rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0;
    }

    .card-badge {
      font-size: 0.68rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .card-badge.loading {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .card-badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .input-group label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .input-with-action {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .model-loader-card input[type="text"] {
      flex: 1;
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem 0.7rem;
      border-radius: 7px;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .model-loader-card input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem 0.65rem;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .loader-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-primary-accent {
      flex: 2;
      background: linear-gradient(135deg, #ff2a3b 0%, #d81224 100%);
      color: #fff;
      border: 1px solid #ff5967;
      box-shadow: 0 3px 10px rgba(255, 42, 59, 0.35);
      justify-content: center;
    }

    .btn-primary-accent:hover:not(:disabled) {
      background: linear-gradient(135deg, #ff4352 0%, #eb1e31 100%);
      box-shadow: 0 4px 14px rgba(255, 42, 59, 0.55);
    }

    .btn-subtle {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid var(--border);
      justify-content: center;
      font-size: 0.75rem;
      padding: 0.5rem;
    }

    .btn-subtle:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .model-msg {
      font-size: 0.72rem;
      min-height: 1rem;
      color: var(--text-muted);
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .model-msg.success {
      color: #34d399;
    }

    .model-msg.error {
      color: #f87171;
    }

    /* Bottom Control Bar */
    .controls-panel {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .btn-xr {
      background: linear-gradient(135deg, #ff2a3b 0%, #e01124 100%);
      border: 1px solid #ff5967;
      box-shadow: 0 4px 14px rgba(255, 42, 59, 0.4);
    }

    .btn-xr:hover:not(:disabled) {
      background: linear-gradient(135deg, #ff4352 0%, #eb1e31 100%);
      box-shadow: 0 6px 20px rgba(255, 42, 59, 0.6);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.05);
    }

    /* Loading Overlay */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 42, 59, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #xr-overlay-msg {
      position: absolute;
      bottom: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #cbd5e1;
      pointer-events: none;
    }

    @media (max-width: 960px) {
      .model-loader-card {
        top: auto;
        bottom: 5.8rem;
        right: 1rem;
        left: 1rem;
        width: auto;
        max-width: none;
      }
      .info-card {
        top: 4.5rem;
        left: 1rem;
        padding: 0.6rem 0.8rem;
        width: 190px;
        font-size: 0.75rem;
      }
      #xr-overlay-msg {
        display: none;
      }
    }
  </style>

  <!-- Import maps polyfill for ES module browser support -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-title" style="font-weight: 600; font-size: 0.95rem; letter-spacing: 0.5px;">Loading 3D Model...</div>
    <div id="load-progress" style="font-size: 0.8rem; color: var(--text-muted);">0%</div>
  </div>

  <header>
    <div class="brand">
      <h1 id="brand-title">🏎️ 3D Model Viewer</h1>
      <span class="pill">WebXR Mode</span>
    </div>
    <div id="xr-support-status" class="xr-status-tag">
      <span class="dot"></span>
      <span id="xr-status-text">Checking WebXR...</span>
    </div>
  </header>

  <!-- Left Stats Info Card -->
  <div class="info-card">
    <h4>Model & WebXR Specs</h4>
    <div class="stat-row">
      <span class="stat-lbl">Format</span>
      <span class="stat-val" id="format-spec">GLB</span>
    </div>
    <div class="stat-row">
      <span class="stat-lbl">Triangles</span>
      <span class="stat-val" id="poly-count">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-lbl">Vertices</span>
      <span class="stat-val" id="vert-count">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-lbl">Real Length</span>
      <span class="stat-val" id="spec-length">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-lbl">Real Width</span>
      <span class="stat-val" id="spec-width">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-lbl">Real Height</span>
      <span class="stat-val" id="spec-height">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-lbl">FPS</span>
      <span class="stat-val" id="fps-counter">60</span>
    </div>
  </div>

  <!-- Right Model Loader Card -->
  <div class="model-loader-card">
    <div class="card-header">
      <h4>Load 3D Model</h4>
      <span class="card-badge" id="model-status-badge">Ready</span>
    </div>
    <div class="input-group">
      <label for="model-file-input">Model File Name / Path</label>
      <div class="input-with-action">
        <input type="text" id="model-file-input" list="model-presets" placeholder="e.g. models/red_race_car.glb" value="models/red_race_car.glb" spellcheck="false" autocomplete="off" />
        <label for="local-file-picker" class="btn-icon" title="Browse local 3D file">
          <span>📁</span>
          <input type="file" id="local-file-picker" accept=".glb,.gltf,.obj,.fbx,.stl" style="display:none;" />
        </label>
      </div>
      <datalist id="model-presets">
        <option value="models/red_race_car.glb">models/red_race_car.glb (GLB)</option>
        <option value="models/red_race_car.obj">models/red_race_car.obj (OBJ)</option>
        <option value="models/red_race_car.fbx">models/red_race_car.fbx (FBX)</option>
        <option value="models/red_race_car.stl">models/red_race_car.stl (STL)</option>
      </datalist>
    </div>
    <div class="input-group">
      <label for="material-file-input">Material / MTL File (Optional for OBJ)</label>
      <input type="text" id="material-file-input" placeholder="e.g. models/red_race_car.mtl" spellcheck="false" autocomplete="off" />
    </div>
    <div class="loader-actions">
      <button id="btn-load-model" class="btn btn-primary-accent" type="button">
        <span>⚡</span> <span>Load Model</span>
      </button>
      <button id="btn-quick-car" class="btn btn-subtle" type="button" title="Load default Red Race Car">
        <span>🏎️</span> <span>Default Car</span>
      </button>
    </div>
    <div id="model-load-msg" class="model-msg">Current: models/red_race_car.glb</div>
  </div>

  <div id="xr-overlay-msg">Drag to orbit &bull; Scroll to zoom &bull; Click 'Enter VR/AR' for headset</div>

  <!-- Bottom Control Bar -->
  <div class="controls-panel">
    <button id="btn-vr" class="btn btn-xr" disabled>
      <span>🥽</span> <span id="vr-btn-label">Enter VR</span>
    </button>
    <button id="btn-ar" class="btn" disabled>
      <span>📱</span> <span id="ar-btn-label">Enter AR</span>
    </button>
    <button id="btn-auto-rotate" class="btn">
      <span>🔄</span> <span>Rotate</span>
    </button>
    <button id="btn-wireframe" class="btn">
      <span>🕸️</span> <span>Wireframe</span>
    </button>
    <button id="btn-reset-cam" class="btn">
      <span>🎯</span> <span>Reset View</span>
    </button>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    // Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1118);
    scene.fog = new THREE.FogExp2(0x0e1118, 0.08);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.8, 1.4, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    // Orbit Controls (for non-XR mode)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.01; // Don't clip through ground
    controls.minDistance = 1.2;
    controls.maxDistance = 15;

    // Lighting (Studio PBR setup)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x223344, 0.7);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(4, 5, 3);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0001;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 15;
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -3;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7799bb, 1.2);
    fillLight.position.set(-4, 3, -2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xff3344, 1.5);
    rimLight.position.set(0, 2, -4);
    scene.add(rimLight);

    // Ground Environment with Grid and Shadow Receiver
    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.45 });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    const gridHelper = new THREE.GridHelper(20, 40, 0xff2a3b, 0x232938);
    gridHelper.position.y = 0.001;
    scene.add(gridHelper);

    // Radial floor glow circle
    const glowGeo = new THREE.RingGeometry(0.01, 3.5, 64);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x1f2430,
      side: THREE.DoubleSide
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    glowMesh.rotation.x = -Math.PI / 2;
    glowMesh.position.y = -0.001;
    scene.add(glowMesh);

    // Model Root Group
    const carRoot = new THREE.Group();
    scene.add(carRoot);

    // WebXR Controllers Setup
    const controllerFactory = new XRControllerModelFactory();
    const controllers = [];
    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      scene.add(controller);

      const controllerGrip = renderer.xr.getControllerGrip(i);
      controllerGrip.add(controllerFactory.createControllerModel(controllerGrip));
      scene.add(controllerGrip);

      // Simple pointer ray
      const rayGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -2)
      ]);
      const rayMat = new THREE.LineBasicMaterial({ color: 0xff3344, transparent: true, opacity: 0.7 });
      const rayLine = new THREE.Line(rayGeo, rayMat);
      controller.add(rayLine);

      controllers.push(controller);
    }

    // Loaders
    const gltfLoader = new GLTFLoader();
    const objLoader = new OBJLoader();
    const mtlLoader = new MTLLoader();
    const fbxLoader = new FBXLoader();
    const stlLoader = new STLLoader();

    let carModel = null;
    let autoRotate = false;
    let isWireframe = false;

    // UI Elements
    const loaderElem = document.getElementById('loader');
    const loaderTitle = document.getElementById('loader-title');
    const loadProgress = document.getElementById('load-progress');
    const statusBadge = document.getElementById('model-status-badge');
    const modelMsg = document.getElementById('model-load-msg');
    const brandTitle = document.getElementById('brand-title');

    const modelFileInput = document.getElementById('model-file-input');
    const materialFileInput = document.getElementById('material-file-input');
    const btnLoadModel = document.getElementById('btn-load-model');
    const btnQuickCar = document.getElementById('btn-quick-car');
    const localFilePicker = document.getElementById('local-file-picker');

    function setStatus(text, state) {
      statusBadge.textContent = text;
      statusBadge.className = 'card-badge' + (state ? ` ${state}` : '');
    }

    function setMessage(text, type = '') {
      modelMsg.textContent = text;
      modelMsg.className = 'model-msg' + (type ? ` ${type}` : '');
    }

    function showLoader(title) {
      loaderTitle.textContent = title;
      loadProgress.textContent = '0%';
      loaderElem.style.display = 'flex';
      loaderElem.style.opacity = '1';
    }

    function hideLoader() {
      loaderElem.style.opacity = '0';
      setTimeout(() => {
        loaderElem.style.display = 'none';
      }, 400);
    }

    function onProgress(xhr) {
      if (xhr.lengthComputable && xhr.total > 0) {
        const percent = Math.round((xhr.loaded / xhr.total) * 100);
        loadProgress.textContent = `${percent}%`;
      }
    }

    function disposeHierarchy(obj) {
      obj.traverse((child) => {
        if (child.isMesh) {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(m => {
              for (const key in m) {
                if (m[key] && m[key].isTexture) {
                  m[key].dispose();
                }
              }
              m.dispose();
            });
          }
        }
      });
    }

    function resolveModelUrl(pathStr) {
      if (!pathStr) return '';
      pathStr = pathStr.trim();
      if (
        pathStr.startsWith('http://') ||
        pathStr.startsWith('https://') ||
        pathStr.startsWith('blob:') ||
        pathStr.startsWith('data:') ||
        pathStr.startsWith('/') ||
        pathStr.startsWith('./') ||
        pathStr.startsWith('../')
      ) {
        return pathStr;
      }
      if (pathStr.startsWith('models/')) {
        return pathStr;
      }
      return 'models/' + pathStr;
    }

    async function loadModel(modelInputVal, materialInputVal = '', customName = '') {
      const rawUrl = resolveModelUrl(modelInputVal);
      if (!rawUrl) {
        setStatus('Empty Input', 'error');
        setMessage('Please enter a model file name or path.', 'error');
        return;
      }

      const cleanExt = (customName || rawUrl).split('?')[0].split('#')[0];
      const ext = cleanExt.includes('.') ? cleanExt.split('.').pop().toLowerCase() : 'glb';
      const displayName = customName || rawUrl.split('/').pop();

      setStatus('Loading...', 'loading');
      setMessage(`Loading ${displayName}...`);
      showLoader(`Loading ${displayName}...`);

      try {
        let object3D = null;

        if (ext === 'glb' || ext === 'gltf') {
          const gltf = await new Promise((resolve, reject) => {
            gltfLoader.load(rawUrl, resolve, onProgress, reject);
          });
          object3D = gltf.scene;
        } else if (ext === 'obj') {
          const resolvedMtl = resolveModelUrl(materialInputVal);
          if (resolvedMtl) {
            try {
              const materials = await new Promise((resolve, reject) => {
                mtlLoader.load(resolvedMtl, resolve, undefined, reject);
              });
              materials.preload();
              objLoader.setMaterials(materials);
            } catch (mtlErr) {
              console.warn('Could not load MTL file, loading OBJ with default material:', mtlErr);
              objLoader.setMaterials(null);
            }
          } else {
            objLoader.setMaterials(null);
          }
          object3D = await new Promise((resolve, reject) => {
            objLoader.load(rawUrl, resolve, onProgress, reject);
          });
        } else if (ext === 'fbx') {
          object3D = await new Promise((resolve, reject) => {
            fbxLoader.load(rawUrl, resolve, onProgress, reject);
          });
        } else if (ext === 'stl') {
          const geom = await new Promise((resolve, reject) => {
            stlLoader.load(rawUrl, resolve, onProgress, reject);
          });
          const mat = new THREE.MeshStandardMaterial({
            color: 0xff2a3b,
            metalness: 0.65,
            roughness: 0.35
          });
          object3D = new THREE.Mesh(geom, mat);
        } else {
          // Fallback attempt with GLTF
          const gltf = await new Promise((resolve, reject) => {
            gltfLoader.load(rawUrl, resolve, onProgress, reject);
          });
          object3D = gltf.scene;
        }

        if (!object3D) {
          throw new Error('Loader returned empty object.');
        }

        // Remove and dispose old model
        if (carModel) {
          carRoot.remove(carModel);
          disposeHierarchy(carModel);
          carModel = null;
        }

        carModel = object3D;

        // Compute Bounding Box & Scale to comfortable real-world XR scale (~3.8m length)
        const bbox = new THREE.Box3().setFromObject(carModel);
        const center = bbox.getCenter(new THREE.Vector3());
        const size = bbox.getSize(new THREE.Vector3());

        const maxHoriz = Math.max(size.x, size.z);
        const maxOverall = Math.max(maxHoriz, size.y);
        let scaleFactor = 1;
        if (maxOverall > 0.0001) {
          const targetLength = 3.8;
          scaleFactor = targetLength / (maxHoriz > 0.1 ? maxHoriz : maxOverall);
        }
        carModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

        // Recompute bbox with scale
        bbox.setFromObject(carModel);
        const scaledBottomY = bbox.min.y;

        // Offset so base rests exactly on ground (y = 0) and is centered horizontally
        carModel.position.x = -center.x * scaleFactor;
        carModel.position.y = -scaledBottomY;
        carModel.position.z = -center.z * scaleFactor;

        // Traverse mesh to configure materials, shadows, and calculate poly/vertex counts
        let totalTriangles = 0;
        let totalVertices = 0;

        carModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m => {
                m.envMapIntensity = 1.2;
                if (isWireframe) m.wireframe = true;
                m.needsUpdate = true;
              });
            }
            if (child.geometry) {
              const geom = child.geometry;
              if (geom.index) {
                totalTriangles += geom.index.count / 3;
              } else if (geom.attributes && geom.attributes.position) {
                totalTriangles += geom.attributes.position.count / 3;
              }
              if (geom.attributes && geom.attributes.position) {
                totalVertices += geom.attributes.position.count;
              }
            }
          }
        });

        carRoot.add(carModel);

        // Update stats
        const finalBbox = new THREE.Box3().setFromObject(carModel);
        const finalSize = finalBbox.getSize(new THREE.Vector3());

        document.getElementById('format-spec').textContent = ext.toUpperCase();
        document.getElementById('poly-count').textContent = Math.round(totalTriangles).toLocaleString();
        document.getElementById('vert-count').textContent = Math.round(totalVertices).toLocaleString();
        document.getElementById('spec-length').textContent = `~${finalSize.z.toFixed(2)} m`;
        document.getElementById('spec-width').textContent = `~${finalSize.x.toFixed(2)} m`;
        document.getElementById('spec-height').textContent = `~${finalSize.y.toFixed(2)} m`;
        brandTitle.textContent = `🏎️ ${displayName}`;

        setStatus('Ready', 'ready');
        setMessage(`Loaded: ${displayName}`, 'success');
        hideLoader();
      } catch (err) {
        console.error('Failed to load model:', err);
        setStatus('Error', 'error');
        setMessage(`Load error: ${err.message || 'Check file path'}`, 'error');
        hideLoader();
      }
    }

    // UI Event Listeners for Model Loading
    function triggerLoad() {
      const modelVal = modelFileInput.value.trim();
      const matVal = materialFileInput.value.trim();
      loadModel(modelVal, matVal);
    }

    btnLoadModel.addEventListener('click', triggerLoad);

    modelFileInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') triggerLoad();
    });

    materialFileInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') triggerLoad();
    });

    btnQuickCar.addEventListener('click', () => {
      modelFileInput.value = 'models/red_race_car.glb';
      materialFileInput.value = '';
      loadModel('models/red_race_car.glb');
    });

    localFilePicker.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const blobUrl = URL.createObjectURL(file);
      modelFileInput.value = file.name;
      loadModel(blobUrl, materialFileInput.value.trim(), file.name);
    });

    // View Controls
    const btnAutoRotate = document.getElementById('btn-auto-rotate');
    btnAutoRotate.addEventListener('click', () => {
      autoRotate = !autoRotate;
      btnAutoRotate.style.background = autoRotate ? 'var(--accent)' : 'rgba(255,255,255,0.08)';
    });

    const btnWireframe = document.getElementById('btn-wireframe');
    btnWireframe.addEventListener('click', () => {
      isWireframe = !isWireframe;
      if (carModel) {
        carModel.traverse((child) => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(m => {
              m.wireframe = isWireframe;
            });
          }
        });
      }
      btnWireframe.style.background = isWireframe ? 'var(--accent)' : 'rgba(255,255,255,0.08)';
    });

    const btnResetCam = document.getElementById('btn-reset-cam');
    btnResetCam.addEventListener('click', () => {
      camera.position.set(2.8, 1.4, 3.2);
      controls.target.set(0, 0.5, 0);
      controls.update();
    });

    // WebXR Hardware & Session Management
    const btnVR = document.getElementById('btn-vr');
    const btnAR = document.getElementById('btn-ar');
    const xrStatusTag = document.getElementById('xr-support-status');
    const xrStatusText = document.getElementById('xr-status-text');

    let currentXRSession = null;

    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (supported) {
          btnVR.disabled = false;
          xrStatusTag.classList.add('active');
          xrStatusText.textContent = 'VR Headset Detected / Supported';
        }
      });

      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        if (supported) {
          btnAR.disabled = false;
          xrStatusTag.classList.add('active');
          xrStatusText.textContent = 'WebXR AR / VR Supported';
        }
      });

      navigator.xr.isSessionSupported('immersive-vr').then(vr => {
        navigator.xr.isSessionSupported('immersive-ar').then(ar => {
          if (!vr && !ar) {
            xrStatusText.textContent = 'Desktop / Mobile 3D Mode';
          }
        });
      });
    } else {
      xrStatusText.textContent = 'WebXR Not Available (Browser)';
    }

    async function toggleXRSession(mode) {
      if (currentXRSession) {
        await currentXRSession.end();
        return;
      }

      try {
        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
        const session = await navigator.xr.requestSession(mode, sessionInit);
        renderer.xr.setSession(session);
        currentXRSession = session;

        if (mode === 'immersive-vr') {
          document.getElementById('vr-btn-label').textContent = 'Exit VR';
          scene.background = new THREE.Color(0x0e1118);
          gridHelper.visible = true;
          glowMesh.visible = true;
        } else {
          document.getElementById('ar-btn-label').textContent = 'Exit AR';
          scene.background = null;
          gridHelper.visible = false;
          glowMesh.visible = false;
        }

        session.addEventListener('end', () => {
          currentXRSession = null;
          document.getElementById('vr-btn-label').textContent = 'Enter VR';
          document.getElementById('ar-btn-label').textContent = 'Enter AR';
          scene.background = new THREE.Color(0x0e1118);
          gridHelper.visible = true;
          glowMesh.visible = true;
        });
      } catch (err) {
        console.error('Error starting WebXR session:', err);
        alert('Could not start WebXR session: ' + err.message);
      }
    }

    btnVR.addEventListener('click', () => toggleXRSession('immersive-vr'));
    btnAR.addEventListener('click', () => toggleXRSession('immersive-ar'));

    // FPS Meter
    let frameCount = 0;
    let lastFpsTime = performance.now();
    const fpsElem = document.getElementById('fps-counter');

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render Loop (Compatible with WebXR XRAnimationLoop)
    renderer.setAnimationLoop((timestamp, frame) => {
      if (autoRotate && carModel && !renderer.xr.isPresenting) {
        carRoot.rotation.y += 0.007;
      }

      if (!renderer.xr.isPresenting) {
        controls.update();
      }

      renderer.render(scene, camera);

      frameCount++;
      if (timestamp - lastFpsTime >= 1000) {
        fpsElem.textContent = Math.round((frameCount * 1000) / (timestamp - lastFpsTime));
        frameCount = 0;
        lastFpsTime = timestamp;
      }
    });

    // Initial Model Load
    loadModel('models/red_race_car.glb');
  </script>
</body>
</html>
