<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="theme-color" content="#cc0000">
  <meta name="description" content="Work Tonight XR — Target overnight restocking shift with Addyson from 8:30 PM to 3:00 AM. Restock Jumbo Squishies, NeeDoh Squishies, Clickers, Large & Small VRs, enjoy 9:00 PM lunch, and reunite lost kids on the Big Red Phone.">
  <title>Addyson's Night Shift XR | Calm Chess Games</title>

  <!-- Favicon & Web Icons -->
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">

  <!-- Three.js & WebXR Addons Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --target-red: #cc0000;
      --target-red-bright: #ef233c;
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(204, 0, 0, 0.42);
      --ink: #18181b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #0b1022;
      color: var(--ink);
      font-family: "Segoe UI Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    main.xr-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #xr-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* Minimal Top Bar — ZERO instructional/how-to-play badges */
    header.top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 12;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding:
        calc(clamp(10px, 1.8vw, 16px) + env(safe-area-inset-top, 0px))
        calc(clamp(10px, 2vw, 18px) + env(safe-area-inset-right, 0px))
        0
        calc(clamp(10px, 2vw, 18px) + env(safe-area-inset-left, 0px));
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 44px;
      min-height: 44px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 2px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(0.92rem, 1.9vw, 1.08rem);
      font-variant-numeric: tabular-nums;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.14s ease, background-color 0.2s ease;
    }

    .hud-pill:hover,
    .hud-pill:focus-visible {
      transform: translateY(-1px) scale(1.04);
      background: #ffffff;
      outline: 2.5px solid var(--target-red-bright);
      outline-offset: 2px;
    }

    .hud-pill--static {
      cursor: default;
    }

    .hud-pill--static:hover {
      transform: none;
    }

    .hud-pill--clock {
      background: rgba(17, 19, 26, 0.88);
      color: #ff4d4d;
      border-color: rgba(255, 77, 77, 0.72);
      letter-spacing: 0.03em;
      font-family: "Consolas", "Courier New", ui-monospace, monospace;
      font-size: clamp(0.98rem, 2.1vw, 1.16rem);
    }

    .hud-pill--xr {
      background: rgba(224, 242, 254, 0.92);
      border-color: rgba(14, 165, 233, 0.75);
      color: #0369a1;
    }

    .hud-pill--xr[hidden] {
      display: none !important;
    }

    /* Iconic Target Employee Name Badge: "Hello, my name is Addyson" */
    .name-badge {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      min-width: 146px;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      border: 2.5px solid var(--target-red);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      transform: rotate(-1.5deg);
      pointer-events: auto;
    }

    .name-badge__top {
      background: var(--target-red);
      color: #ffffff;
      padding: 4px 10px 3px;
      text-align: center;
      line-height: 1.05;
    }

    .name-badge__hello {
      display: block;
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    .name-badge__sub {
      display: block;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0.94;
    }

    .name-badge__name {
      padding: 4px 12px 6px;
      text-align: center;
      font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI Rounded", cursive, sans-serif;
      font-size: 1.24rem;
      font-weight: 900;
      color: #18181b;
      line-height: 1.1;
    }

    .name-badge__stripe {
      height: 5px;
      background: var(--target-red);
    }

    /* Store PA Loudspeaker Announcement Bar (only appears when paging on the Big Red Phone / shift chime) */
    .pa-banner {
      position: fixed;
      top: calc(74px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      max-width: min(92vw, 640px);
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(204, 0, 0, 0.94);
      color: #ffffff;
      border: 2.5px solid #ffe066;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.36);
      font-weight: 800;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      text-align: center;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pa-banner[hidden] {
      display: none !important;
    }

    /* Clean subtle center dot reticle (no text) */
    .reticle {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid rgba(24, 24, 27, 0.55);
      pointer-events: none;
      z-index: 8;
      transition: transform 0.14s ease, background-color 0.14s ease, border-color 0.14s ease;
    }

    .reticle.is-active {
      transform: translate(-50%, -50%) scale(1.65);
      background: #ffe066;
      border-color: #cc0000;
      box-shadow: 0 0 12px rgba(255, 224, 102, 0.85);
    }

    /* 3:00 AM Shift Complete Native Modal Dialog */
    dialog.shift-dialog {
      border: 3px solid var(--target-red);
      border-radius: 24px;
      padding: 0;
      max-width: min(92vw, 430px);
      width: 100%;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    dialog.shift-dialog:modal {
      overscroll-behavior: contain;
    }

    dialog.shift-dialog::backdrop {
      background: rgba(11, 16, 34, 0.72);
      backdrop-filter: blur(8px);
      overflow: hidden;
      overscroll-behavior: contain;
    }

    .shift-dialog__head {
      background: var(--target-red);
      color: #ffffff;
      padding: 20px 22px 16px;
      text-align: center;
    }

    .shift-dialog__head h1 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 900;
    }

    .shift-dialog__time {
      margin: 6px 0 0;
      font-weight: 800;
      opacity: 0.92;
      font-size: 0.98rem;
    }

    .shift-dialog__body {
      padding: 20px 22px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .shift-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .shift-stat-card {
      background: #fef2f2;
      border: 2px solid rgba(204, 0, 0, 0.22);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .shift-stat-card__num {
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--target-red);
      line-height: 1.1;
    }

    .shift-stat-card__label {
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #52525b;
    }

    .shift-dialog__btn {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 999px;
      background: var(--target-red);
      color: #ffffff;
      font-family: inherit;
      font-size: 1.08rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(204, 0, 0, 0.34);
      transition: transform 0.14s ease, background-color 0.2s ease;
    }

    .shift-dialog__btn:hover,
    .shift-dialog__btn:focus-visible {
      background: #a80000;
      transform: scale(1.02);
      outline: 3px solid #ffe066;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Addyson's Target Night Shift XR</h1>

  <header class="top-bar">
    <div class="top-left">
      <a class="hud-pill" href="../index.html" aria-label="Home">&larr;</a>
      <div class="name-badge" aria-label="Hello my name is Addyson">
        <div class="name-badge__top">
          <span class="name-badge__hello">HELLO</span>
          <span class="name-badge__sub">my name is</span>
        </div>
        <div class="name-badge__name">Addyson</div>
        <div class="name-badge__stripe" aria-hidden="true"></div>
      </div>
      <button type="button" class="hud-pill hud-pill--xr" id="btn-enter-vr" hidden>VR</button>
      <button type="button" class="hud-pill hud-pill--xr" id="btn-enter-ar" hidden>AR</button>
    </div>

    <div class="top-right">
      <div class="hud-pill hud-pill--static hud-pill--clock" id="hud-clock" aria-label="Shift clock">8:30 PM</div>
      <div class="hud-pill hud-pill--static" aria-label="Items restocked">
        <span aria-hidden="true">🧸</span>
        <span id="hud-stocked">0</span>
      </div>
      <div class="hud-pill hud-pill--static" aria-label="Kids reunited">
        <span aria-hidden="true">☎️</span>
        <span id="hud-kids">0</span>
      </div>
      <button type="button" class="hud-pill" id="btn-mute" aria-label="Toggle sound" aria-pressed="true">🔊</button>
    </div>
  </header>

  <div class="pa-banner" id="pa-banner" role="status" aria-live="polite" hidden>
    <span aria-hidden="true">📢</span>
    <span id="pa-text"></span>
  </div>

  <div class="reticle" id="reticle" aria-hidden="true"></div>

  <main class="xr-stage">
    <canvas id="xr-canvas" aria-label="Interactive 3D Target Night Shift XR Store"></canvas>
  </main>

  <dialog class="shift-dialog" id="shift-complete-dialog" aria-labelledby="shift-complete-title">
    <div class="shift-dialog__head">
      <h1 id="shift-complete-title">3:00 AM — Heading Home!</h1>
      <p class="shift-dialog__time">8:30 PM – 3:00 AM</p>
    </div>
    <div class="shift-dialog__body">
      <div class="name-badge" aria-hidden="true">
        <div class="name-badge__top">
          <span class="name-badge__hello">HELLO</span>
          <span class="name-badge__sub">my name is</span>
        </div>
        <div class="name-badge__name">Addyson</div>
        <div class="name-badge__stripe"></div>
      </div>

      <div class="shift-stats">
        <div class="shift-stat-card">
          <div class="shift-stat-card__num" id="summary-stocked">0</div>
          <div class="shift-stat-card__label">Restocked</div>
        </div>
        <div class="shift-stat-card">
          <div class="shift-stat-card__num" id="summary-kids">0</div>
          <div class="shift-stat-card__label">Reunited</div>
        </div>
      </div>

      <form method="dialog" style="width: 100%;">
        <button type="submit" value="again" class="shift-dialog__btn" id="btn-play-again" autofocus>New Shift</button>
      </form>
    </div>
  </dialog>

  <script type="module" src="js/work_tonight.js"></script>
  <script src="../js/analytics.js" defer></script>
</body>
</html>
