<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="theme-color" content="#ff85c4">
  <meta name="description" content="Kawaii 7-Row Mechanical Clicker XR — 7 pastel rows of adorable cartoonish mechanical keyboard clickers in a soft pink silicone case with satisfying tactile clicks.">
  <title>Kawaii Pink Clicker XR | Calm Chess Games</title>

  <!-- Favicon & Web Icons -->
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">

  <!-- Three.js & WebXR Addons Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg-top: #dceeff;
      --bg-mid: #f3e4ff;
      --bg-bot: #ffe3f3;
      --pill-bg: rgba(255, 255, 255, 0.78);
      --pill-border: rgba(255, 112, 184, 0.58);
      --pink-deep: #d62d84;
      --pink-hot: #ff5ca8;
      --violet: #6b2d8c;
      --text-main: #4a1959;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
      color: var(--text-main);
      font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    main.xr-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      content-visibility: auto;
      contain-intrinsic-size: auto 100vw auto 100vh;
    }

    #xr-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #xr-canvas:active {
      cursor: grabbing;
    }

    #xr-canvas.is-hovering-target {
      cursor: pointer;
    }

    header.top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding:
        calc(clamp(10px, 2vw, 16px) + env(safe-area-inset-top, 0px))
        calc(clamp(10px, 2.2vw, 18px) + env(safe-area-inset-right, 0px))
        0
        calc(clamp(10px, 2.2vw, 18px) + env(safe-area-inset-left, 0px));
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 46px;
      min-height: 46px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 2.5px solid var(--pill-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 20px rgba(214, 45, 132, 0.18);
      color: var(--text-main);
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(1rem, 2.2vw, 1.18rem);
      font-variant-numeric: tabular-nums;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.14s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .top-pill:hover,
    .top-pill:focus-visible {
      transform: translateY(-1px) scale(1.05);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(255, 92, 168, 0.28);
      outline: 2.5px solid var(--pink-hot);
      outline-offset: 2px;
    }

    .top-pill:active {
      transform: scale(0.95);
    }

    .top-pill--home {
      color: var(--pink-deep);
    }

    .top-pill--clicks {
      cursor: default;
      border-color: rgba(255, 92, 168, 0.72);
      color: var(--pink-deep);
    }

    .top-pill--clicks:hover {
      transform: none;
    }

    .top-pill--icon {
      padding: 6px 12px;
      font-size: 1.25rem;
    }

    .top-pill--xr {
      border-color: rgba(14, 165, 233, 0.65);
      background: rgba(224, 242, 254, 0.86);
      color: #0369a1;
      font-size: 0.95rem;
    }

    .top-pill--xr[hidden] {
      display: none !important;
    }

    .top-pill.is-pop {
      animation: pillPop 0.36s cubic-bezier(0.22, 1.6, 0.36, 1);
    }

    @keyframes pillPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.18); box-shadow: 0 0 24px rgba(255, 92, 168, 0.55); }
      100% { transform: scale(1); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Kawaii 7-Row Mechanical Clicker XR</h1>

  <header class="top-bar">
    <div class="top-left">
      <a class="top-pill top-pill--home" href="../index.html" aria-label="Home">&larr;</a>
      <button type="button" class="top-pill top-pill--xr" id="btn-enter-vr" hidden>VR</button>
      <button type="button" class="top-pill top-pill--xr" id="btn-enter-ar" hidden>AR</button>
    </div>

    <div class="top-right">
      <button type="button" class="top-pill top-pill--icon" id="btn-wave" aria-label="Rainbow wave animation" title="Rainbow Wave">🌈</button>
      <button type="button" class="top-pill top-pill--icon" id="btn-sound-mode" aria-label="Toggle sparkle chime with mechanical click" aria-pressed="true" title="Sparkle Thock Mode">🎵</button>
      <div class="top-pill top-pill--clicks" id="clicks-pill" aria-label="Total clicks">
        <span aria-hidden="true">💖</span>
        <span id="stat-clicks">0</span>
      </div>
    </div>
  </header>

  <main class="xr-stage">
    <canvas id="xr-canvas" aria-label="Interactive 3D XR 7 rows of cartoonish mechanical keyboard clickers in a pink silicone case"></canvas>
  </main>

  <script type="module" src="js/clicker_game.js"></script>
  <script src="../js/analytics.js" defer></script>
</body>
</html>
