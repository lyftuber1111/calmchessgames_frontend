<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>Desk Ergonomics & Back Mobility Trainer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --highlight: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      max-width: 800px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    /* Tab navigation bar */
    .tab-bar {
      display: flex;
      overflow-x: auto;
      background: #0b1324;
      border-bottom: 1px solid var(--card-border);
      padding: 0.25rem 0.5rem;
      scrollbar-width: thin;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border-radius: 0.5rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      background: rgba(0, 0, 0, 0.25);
    }

    /* Tab Content Area */
    .content-area {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .content-area {
        grid-template-columns: 1fr;
      }
    }

    /* Visualizer Frame */
    .visualizer-card {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      min-height: 280px;
      position: relative;
    }

    .svg-visualizer {
      width: 100%;
      height: 220px;
    }

    .visualizer-caption {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.5rem;
    }

    /* Instructions & Timer */
    .exercise-details {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .info-header {
      margin-bottom: 1rem;
    }

    .category-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      display: inline-block;
    }

    .exercise-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .exercise-meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .meta-pill {
      background: #0f172a;
      padding: 0.2rem 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid var(--card-border);
    }

    .steps-list {
      list-style-type: decimal;
      padding-left: 1.25rem;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }

    .steps-list li {
      margin-bottom: 0.4rem;
    }

    /* Timer Widget */
    .timer-panel {
      background: #0b1324;
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .timer-display {
      font-size: 2.2rem;
      font-family: monospace;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .timer-controls {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 0.6rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b1324;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    /* Keyframe Animations for SVGs */
    @keyframes pulse-ring {
      0% { r: 12; opacity: 0.8; }
      50% { r: 18; opacity: 0.2; }
      100% { r: 12; opacity: 0.8; }
    }

    @keyframes mckenzie-arch {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
    }

    @keyframes cat-cow-spine {
      0%, 100% { d: path("M 80,120 Q 140,110 200,120"); }
      50% { d: path("M 80,120 Q 140,150 200,120"); }
    }

    @keyframes arm-leg-reach {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .anim-pulse {
      animation: pulse-ring 2s infinite ease-in-out;
    }
    .anim-arch {
      transform-origin: 140px 160px;
      animation: mckenzie-arch 4s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <header>
    <h1>Desk Ergonomics & Back Mobility Trainer</h1>
    <p>Select any drill below. Use the animated visualizer and interactive timer to pace each routine.</p>
  </header>

  <main class="container">
    <!-- Tab Strip -->
    <nav class="tab-bar" id="tabBar"></nav>

    <!-- Dynamic Exercise Frame -->
    <section class="content-area">
      <!-- Animated Visualizer Card -->
      <div class="visualizer-card">
        <div id="svgContainer" class="svg-visualizer"></div>
        <div id="visualizerCaption" class="visualizer-caption"></div>
      </div>

      <!-- Detail & Timer Column -->
      <div class="exercise-details">
        <div class="info-header">
          <span id="categoryTag" class="category-tag"></span>
          <h2 id="exerciseTitle" class="exercise-title"></h2>
          <div class="exercise-meta">
            <span id="targetMuscle" class="meta-pill"></span>
            <span id="suggestedTime" class="meta-pill"></span>
          </div>
          <ol id="stepList" class="steps-list"></ol>
        </div>

        <!-- Timer Panel -->
        <div class="timer-panel">
          <div id="timerDisplay" class="timer-display">00:30</div>
          <div class="timer-controls">
            <button id="startBtn" class="btn btn-primary" onclick="toggleTimer()">Start Timer</button>
            <button id="resetBtn" class="btn btn-secondary" onclick="resetTimer()">Reset</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/crypto_transport.js"></script>
  <script>if (typeof CryptoTransport === 'undefined') { document.write('<script src="../js/crypto_transport.js"><\/script>'); }</script>
  <script src="js/stretches.js"></script>
</body>
</html>
