<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#2c1b12">
  <meta name="description" content="Interactive Virtual Keyboard with realistic mechanical wooden clicker sounds and carved timber aesthetic.">
  <title>Acoustic Wooden Mechanical Keyboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-wood="walnut">

  <!-- Background decorative grain layer -->
  <div class="desk-grain-overlay" aria-hidden="true"></div>

  <!-- SVG Filters and Asset Definitions -->
  <svg class="svg-definitions" style="display: none;" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Procedural Wood Grain Filter -->
      <filter id="woodGrainFilter" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04 0.008" numOctaves="3" result="noise" />
        <feColorMatrix type="matrix" values="
          0.3 0 0 0 0.15
          0 0.2 0 0 0.08
          0 0 0.1 0 0.04
          0 0 0 0.25 0" in="noise" result="coloredNoise" />
        <feBlend mode="multiply" in="SourceGraphic" in2="coloredNoise" result="blend" />
      </filter>

      <!-- Brass Corner Ornament SVG Template -->
      <g id="brass-corner-bracket">
        <path d="M 0 0 L 28 0 C 28 10 20 18 10 20 L 10 28 L 0 28 Z" fill="url(#brassGrad)" stroke="#523916" stroke-width="1"/>
        <circle cx="8" cy="8" r="3" fill="#301e0d" stroke="#cfa860" stroke-width="0.8"/>
        <line x1="6.5" y1="6.5" x2="9.5" y2="9.5" stroke="#cfa860" stroke-width="0.8"/>
      </g>

      <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff0c2"/>
        <stop offset="35%" stop-color="#cfa860"/>
        <stop offset="70%" stop-color="#936d32"/>
        <stop offset="100%" stop-color="#5a3d16"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="app-container">

    <!-- Top Navigation & Brand Header -->
    <header class="header-section">
      <div class="brand-emblem">
        <!-- SVG Wood & Brass Seal -->
        <svg class="brand-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="url(#brassGrad)" stroke="#3a2215" stroke-width="4"/>
          <circle cx="50" cy="50" r="38" fill="#361f12" stroke="#cca564" stroke-width="2"/>
          <!-- Wooden Keycap Silhouette -->
          <rect x="30" y="32" width="40" height="36" rx="6" fill="#58351f" stroke="#cca564" stroke-width="2"/>
          <text x="50" y="56" font-size="18" font-family="Georgia, serif" font-weight="bold" fill="#ffd899" text-anchor="middle">W</text>
        </svg>
        <div class="brand-text">
          <h1>Artisan Timber Keys</h1>
          <div class="subheading">Mechanical Wooden Acoustic Keyboard</div>
        </div>
      </div>

      <!-- Desk Controls (Wood species, Volume, Sound) -->
      <div class="desk-controls">
        <div class="control-item">
          <label for="wood-select">Timber:</label>
          <select id="wood-select" class="wood-dropdown" aria-label="Select wood species">
            <option value="walnut">Dark Walnut</option>
            <option value="oak">Solid Oak</option>
            <option value="teak">Acoustic Teak</option>
          </select>
        </div>

        <div class="control-item volume-slider-wrap">
          <label for="volume-slider" title="Volume">🔊</label>
          <input type="range" id="volume-slider" class="volume-range" min="0" max="1" step="0.05" value="0.85" aria-label="Volume slider">
        </div>

        <button id="mute-btn" class="brass-icon-btn" title="Toggle Sound" aria-label="Toggle Mute">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Text Display Field (Parchment & Wood Frame) -->
    <section class="display-plaque" aria-label="Text Display Area">
      <div class="display-header">
        <div class="display-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span>Parchment Display</span>
        </div>

        <div class="display-actions">
          <button id="demo-btn" class="wood-pill-btn" title="Run Typewriter Demo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <span>Demo</span>
          </button>
          <button id="copy-btn" class="wood-pill-btn" title="Copy to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>Copy</span>
          </button>
          <button id="clear-btn" class="wood-pill-btn" title="Clear text">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <!-- Parchment Textarea -->
      <div class="parchment-frame">
        <textarea
          id="text-display"
          class="display-textarea"
          rows="3"
          placeholder="Click or tap any wooden key below, or type with your physical keyboard..."
          aria-label="Text output display"
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Display Footer Counters -->
      <div class="display-footer">
        <div class="display-stats">
          <div class="stat-item">Characters: <span id="char-count">0</span></div>
          <div class="stat-item">Words: <span id="word-count">0</span></div>
          <div class="stat-item">Keystrokes: <span id="keypress-count">0</span></div>
        </div>
        <div class="mobile-hint">
          <span>📐 Horizontal Layout Ready</span>
        </div>
      </div>
    </section>

    <!-- Virtual Wooden Keyboard Chassis (Always Horizontal) -->
    <main class="keyboard-chassis" aria-label="Interactive Wooden Keyboard">
      <!-- SVG Brass Corner Brackets -->
      <svg class="corner-bracket corner-top-left" viewBox="0 0 32 32">
        <use href="#brass-corner-bracket"/>
      </svg>
      <svg class="corner-bracket corner-top-right" viewBox="0 0 32 32">
        <use href="#brass-corner-bracket"/>
      </svg>
      <svg class="corner-bracket corner-bottom-left" viewBox="0 0 32 32">
        <use href="#brass-corner-bracket"/>
      </svg>
      <svg class="corner-bracket corner-bottom-right" viewBox="0 0 32 32">
        <use href="#brass-corner-bracket"/>
      </svg>

      <!-- Chassis Screws -->
      <div class="chassis-screw screw-tl"></div>
      <div class="chassis-screw screw-tr"></div>
      <div class="chassis-screw screw-bl"></div>
      <div class="chassis-screw screw-br"></div>

      <!-- Inset Recessed Bed with Horizontal Rows -->
      <div class="keybed-recess">
        <div id="virtual-keyboard" class="keyboard-grid" role="region" aria-label="Virtual Keys">
          <!-- Keys populated dynamically via keyboard.js with SVG icons -->
        </div>
      </div>
    </main>

  </div>

  <!-- Toast Notification Feedback -->
  <div id="toast" class="toast-notice" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="keyboard.js"></script>
</body>
</html>
