<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HTML5 Chess + Stockfish</title>
  <style>*{box-sizing:border-box;touch-action:manipulation;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:calc(14px + 2pt);background-color:#1a1a20;color:#fff;display:flex;flex-direction:column;align-items:center;margin:0;padding:8px;min-height:100vh;}h1{margin:2px 0;font-size:calc(1.15rem + 2pt);}.status-bar{display:flex;align-items:center;gap:6px;font-size:calc(0.8rem + 2pt);margin-bottom:6px;}.dot{width:10px;height:10px;border-radius:50%;background:#f39c12;}.dot.connected{background:#2ecc71;}.dot.offline{background:#9b59b6;}.dot.http{background:#3498db;}.dot.error{background:#e74c3c;}.game-area{display:flex;width:100%;max-width:360px;justify-content:center;}#board-wrapper{position:relative;width:320px;height:320px;max-width:calc(100vw - 20px);max-height:calc(100vw - 20px);aspect-ratio:1 / 1;user-select:none;}#board{display:grid;grid-template-columns:repeat(8,12.5%);grid-template-rows:repeat(8,12.5%);width:100%;height:100%;border:2px solid #333;border-radius:4px;overflow:hidden;}.square{width:100%;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;position:relative;overflow:hidden;}.square span.piece-icon{font-size:min(8vmin,34px);line-height:1;pointer-events:none;display:flex;align-items:center;justify-content:center;}.light{background-color:#e2d6b5;}.dark{background-color:#b88b4a;}.selected{background-color:#7fa650 !important;}.valid-dest::after{content:"";width:28%;height:28%;background:rgba(20,20,20,0.35);border-radius:50%;position:absolute;pointer-events:none;}.valid-capture::after{content:"";width:75%;height:75%;border:4px solid rgba(231,76,60,0.6);border-radius:50%;position:absolute;pointer-events:none;}#arrow-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}#game-over-banner{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(18,18,24,0.88);backdrop-filter:blur(3px);flex-direction:column;alig 07acc;border-color:#38a5e8;}button.error-retry{background:#c0392b !important;border-color:#e74c3c !important;}#debug-log{width:100%;max-width:360px;background:#111;color:#0f0;font-family:monospace;font-size:calc(10px + 2pt);padding:5px;margin-top:6px;border-radius:4px;max-height:55px;overflow-y:auto;}</style>

<body>

  <h1>HTML5 Chess + Stockfish</h1>
  
  <div class="status-bar">
    <div id="status-dot" class="dot"></div>
    <span id="status-label">Initializing...</span>
  </div>

  <div class="game-area">
    <div id="board-wrapper">
      <div id="board"></div>

      <svg id="arrow-overlay">
        <defs id="marker-defs"></defs>
      </svg>

      <div id="game-over-banner">
        <div id="game-over-title">CHECKMATE!</div>
        <div id="game-over-subtitle">White wins by checkmate</div>
        <button class="play-again-btn" id="bannerNewGameBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div class="analysis-panel">
    <div class="opening-badge" id="opening-display">Opening: Starting Position</div>
    <div class="row">
      <span id="turn-status">White to move</span>
      <span id="depth-label">Depth: -</span>
    </div>
    <div class="row">
      <span class="best-move" id="best-move-display">Analysed Move: -</span>
    </div>
    <div class="pv-line" id="pv-text">Line: -</div>
  </div>

  <div class="controls">
    <button id="newBtn">New</button>
    <button id="flipBtn">Flip</button>
    <button id="modeBtn">Mode: vs AI</button>
    <button id="arrowToggleBtn" class="active">Arrow: ON</button>
    <button id="retryBtn" style="display:none;" class="error-retry">Retry Engine</button>
    <select id="depthSelect">
      <option value="6">Depth 6 (Fast)</option>
      <option value="10" selected>Depth 10 (Solid)</option>
      <option value="14">Depth 14 (Deep)</option>
    </select>
  </div>

  <div id="debug-log">Ready.</div>

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <!-- Unobfuscated Server Connection Gateway -->
  <script>
    /**
     * Dedicated Server Connection Gateway
     * Maintains direct, unhindered connectivity to external Stockfish & Lichess servers.
     */
    window.ChessServerGateway = {
      ws: null,
      wsConnected: false,

      // Establish WebSocket connection to chess-api.com
      connectWebSocket: function(callbacks) {
        if (!navigator.onLine) {
          if (callbacks.onClose) callbacks.onClose(false);
          return;
        }
        try {
          const ws = new WebSocket('wss://chess-api.com/v1');
          this.ws = ws;

          ws.onopen = function() {
            window.ChessServerGateway.wsConnected = true;
            if (callbacks.onOpen) callbacks.onOpen();
          };

          ws.onmessage = function(event) {
            try {
              const data = JSON.parse(event.data);
              if (callbacks.onMessage) callbacks.onMessage(data);
            } catch (err) {
              if (callbacks.onError) callbacks.onError(err);
            }
          };

          ws.onerror = function(err) {
            window.ChessServerGateway.wsConnected = false;
            if (callbacks.onError) callbacks.onError(err);
          };

          ws.onclose = function() {
            window.ChessServerGateway.wsConnected = false;
            if (callbacks.onClose) callbacks.onClose(navigator.onLine);
          };
        } catch (err) {
          window.ChessServerGateway.wsConnected = false;
          if (callbacks.onError) callbacks.onError(err);
        }
      },

      // Query WebSocket for move analysis
      sendWebSocketQuery: function(fen, depth) {
        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
          this.ws.send(JSON.stringify({ fen: fen, depth: depth }));
          return true;
        }
        return false;
      },

      // HTTP Fallback 1: POST to chess-api.com
      queryChessApiHttp: function(fen, depth, onSuccess, onError) {
        fetch('https://chess-api.com/v1', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fen: fen, depth: depth })
        })
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(data) {
          if (data.error) throw new Error(data.error);
          if (onSuccess) onSuccess(data);
        })
        .catch(function(err) {
          if (onError) onError(err);
        });
      },

      // HTTP Fallback 2: GET to Stockfish Online API
      queryStockfishOnline: function(fen, depth, onSuccess, onError) {
        const url = 'https://stockfish.online/api/s/v2.php?fen=' + encodeURIComponent(fen) + '&depth=' + depth;
        fetch(url)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(data) {
          if (data && data.success && data.bestmove) {
            const parts = data.bestmove.split(' ');
            const move = parts[1];
            if (onSuccess) {
              onSuccess({
                type: 'bestmove',
                move: move,
                eval: data.evaluation,
                mate: data.mate,
                pv: data.continuation
              });
            }
          } else {
            throw new Error('Stockfish Online response missing bestmove');
          }
        })
        .catch(function(err) {
          if (onError) onError(err);
        });
      },

      // Query Lichess Masters opening explorer
      queryLichessOpening: function(fen, onSuccess, onError) {
        const url = 'https://explorer.lichess.ovh/masters?fen=' + encodeURIComponent(fen);
        fetch(url)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(data) {
          if (onSuccess) onSuccess(data);
        })
        .catch(function(err) {
          if (onError) onError(err);
        });
      }
    };
  </script>
