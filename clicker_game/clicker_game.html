<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="theme-color" content="#1a1033">
  <meta name="description" content="Mystery Box XR Clicker — Tall mystery boxes with silver rip packages and cartoonish keyboard clicker keys.">
  <title>Mystery Box XR Clicker | Calm Chess Games</title>

  <!-- Favicon & Web Icons -->
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">

  <!-- Three.js & WebXR Addons Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg-sky: #1b1138;
      --pill-bg: rgba(30, 18, 62, 0.72);
      --pill-border: rgba(255, 214, 240, 0.45);
      --gold: #ffe066;
      --mint: #52f2b8;
      --pink: #ff7cc3;
      --text-main: #fff8fc;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 25%, #321c66 0%, var(--bg-sky) 75%);
      color: var(--text-main);
      font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    main.xr-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #xr-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: default;
    }

    #xr-canvas.is-hovering-target {
      cursor: pointer;
    }

    /* Ultra-clean top bar only — zero footer controls, zero instructional badges */
    header.top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding:
        calc(clamp(10px, 2vw, 16px) + env(safe-area-inset-top, 0px))
        calc(clamp(10px, 2.2vw, 18px) + env(safe-area-inset-right, 0px))
        0
        calc(clamp(10px, 2.2vw, 18px) + env(safe-area-inset-left, 0px));
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 2px solid var(--pill-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(10, 4, 28, 0.42);
      color: var(--text-main);
      font-weight: 800;
      font-size: clamp(0.95rem, 2.2vw, 1.18rem);
      font-variant-numeric: tabular-nums;
      text-decoration: none;
    }

    .top-pill--home {
      padding: 6px 13px;
      font-size: 1rem;
      color: var(--gold);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .top-pill--home:hover,
    .top-pill--home:focus-visible {
      transform: scale(1.06);
      background: rgba(58, 30, 108, 0.85);
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .top-pill--cash {
      border-color: rgba(82, 242, 184, 0.72);
      color: var(--mint);
      text-shadow: 0 0 12px rgba(82, 242, 184, 0.45);
    }

    .top-pill--keys {
      border-color: rgba(255, 124, 195, 0.75);
      color: #ffe4f3;
    }

    .top-pill--xr {
      cursor: pointer;
      border-color: rgba(125, 211, 252, 0.8);
      background: rgba(14, 116, 144, 0.55);
      color: #e0f2fe;
      font-size: 0.9rem;
    }

    .top-pill--xr[hidden] {
      display: none !important;
    }

    .top-pill.is-pop {
      animation: pillPop 0.65s cubic-bezier(0.22, 1.5, 0.36, 1);
    }

    @keyframes pillPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.22); box-shadow: 0 0 28px rgba(255, 224, 102, 0.85); }
      100% { transform: scale(1); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Mystery Box XR Clicker</h1>

  <header class="top-bar">
    <div class="top-left">
      <a class="top-pill top-pill--home" href="../index.html" aria-label="Home">&larr;</a>
      <button type="button" class="top-pill top-pill--xr" id="btn-enter-vr" hidden>VR</button>
      <button type="button" class="top-pill top-pill--xr" id="btn-enter-ar" hidden>AR</button>
    </div>

    <div class="top-right" aria-label="Score">
      <div class="top-pill top-pill--keys" id="keys-pill" aria-label="Won clicker keys">
        <span aria-hidden="true">⌨️</span>
        <span id="stat-keys">0</span>
      </div>
      <div class="top-pill top-pill--cash" id="cash-pill" aria-label="Won dollars">
        <span id="stat-bankroll">$0</span>
      </div>
    </div>
  </header>

  <main class="xr-stage">
    <canvas id="xr-canvas" aria-label="Interactive 3D XR mystery boxes and cartoon clicker keys"></canvas>
  </main>

  <script type="module" src="js/clicker_game.js"></script>
  <script src="../js/analytics.js" defer></script>
</body>
</html>
